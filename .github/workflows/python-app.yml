#NAME
name: python-uppercase

#TRIGGER
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/python-app.yml'
      - 'py-upper/**'
  workflow_dispatch:

#JOBS
jobs:
  my_test_job:
    runs-on: ubuntu-latest
    steps:
      - name: Check python version
        run: python -V
      
      - name: Display current dirctory
        run: pwd

      - name: List files
        run: ls -R

      - name: Download the code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
        
      - name: Check python version
        run: python -V