#NAME
name: python-uppercase

#TRIGGER
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/python-app.yml'
      - 'py-upper/**'
  workflow_dispatch:

#JOBS
jobs:
  my_test_job:
    runs-on: ubuntu-latest
    steps:
      - name: Check python version
        run: python -V
      
      - name: Display current dirctory
        run: pwd

      - name: List files
        run: ls -R

      - name: Download the code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
        
      - name: Check python version
        run: python -V

#      - name: Install dependencies
#        run: |
#          python -m pip install --upgrade pip
#          pip install -r py-upper/requirements.txt

      - name: Install python dependencies
        uses: py-actions/py-dependency-install@v4
        with:
          path: "py-upper/requirements.txt"
          update-pip: "true"
      
      - name: Run tests
        working-directory: py-upper
        run: pytest -v
  
  my_build_job:
    runs-on: windows-latest
    needs: my_test_job
    strategy:
      matrix:
        python-version: ['3.13','3.12']
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
        
      - name: Install python dependencies
        uses: py-actions/py-dependency-install@v4
        with:
          path: "py-upper/requirements.txt"
          update-pip: "true"
      
      - name: Build project
        run: pyinstaller --onefile py-upper/uppercase.py
        
      - name: List biuld output
        run: ls -R dist/
      
      - name: Rename the exe file
        run: mv dist/uppercase.exe dist/uppercase-${{ matrix.python-version }}.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uppercase-${{ matrix.python-version }}.exe
          path: dist/uppercase-${{ matrix.python-version }}.exe
        
      # - name: Release
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     files: dist/**
      #     body: "Binaries of the uppercase program"
      #     tag_name: ${{ github.ref_name }}

  my_release_job:
    runs-on: ubuntu-latest
    needs: my_build_job
    steps:
      - name: Download build artifacts 3.12
        uses: actions/download-artifact@v4
        with:
          name: uppercase-3.12

      - name: Download build artifacts 3.13
        uses: actions/download-artifact@v4
        with:
          name: uppercase-3.13

      - name: List directory
        run: ls -R

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ./**
          body: "Binaries of the uppercase program for different python versions"
          tag_name: ${{ github.ref_name }}

